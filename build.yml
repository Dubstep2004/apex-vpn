name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.12", cache: false }
      - run: |
          unzip -q apex-vpn-source.zip && cd apex-vpn
          chmod +x gradlew core/build-core.sh
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.0.13004108" > /dev/null
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108
          ./core/build-core.sh
          ./gradlew --no-daemon assembleRelease
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk ../apex-vpn-$V.apk
      - uses: actions/upload-artifact@v4
        with: { name: apex-vpn-apk, path: apex-vpn-*.apk }
