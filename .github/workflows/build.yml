name: Build APEX VPN

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Правка README, картинок и скриптов VPS не пересобирает приложение
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:
  # Раз в неделю «трогаем» ключ подписи в кэше, чтобы GitHub его не удалил
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  keep-signing-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Keep build signing key alive
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: apex-debug-keystore-v1

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: false

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.13004108" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Xray core
        run: XRAY_HOST=1 ./core/fetch-xray.sh

      - name: Cache core
        id: core-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: core-${{ hashFiles('core/**') }}

      - name: Build core (sing-box + apexcore)
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: ./core/build-core.sh

      - name: Check core
        run: |
          ls -la app/libs/ app/src/main/jniLibs/*/ || true
          test -s app/libs/libbox.aar || { echo "::error title=Ядро::app/libs/libbox.aar не найден после сборки ядра"; exit 1; }

      # Без своего ключа сборки подписываются ключом отладки. Он хранится в кэше Actions,
      # чтобы версии ставились поверх друг друга (раньше ключ был новый в каждой сборке).
      - name: Restore build signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: apex-debug-keystore-v1

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apex.jks"
            echo "APEX_KEYSTORE_PATH=$RUNNER_TEMP/apex.jks" >> "$GITHUB_ENV"
          else
            if [ ! -s ~/.android/debug.keystore ]; then
              mkdir -p ~/.android
              keytool -genkeypair -keystore ~/.android/debug.keystore -storetype PKCS12 -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            fi
            echo "::warning title=Подпись::Нет секрета APEX_KEYSTORE_BASE64 — APK подписан ключом сборки. Добавьте ключ с сервера (docs/GUIDE.md, шаг 3), чтобы версии с GitHub и с сервера ставились друг поверх друга."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log; then
            # Ошибки сборки — в аннотации, чтобы их было видно без полного лога
            grep -E "^e: |error:|Error:|What went wrong|Could not|^> [^T]" gradle.log | sed 's/%/%25/g' | head -200 > errors.txt || true
            # Ошибки lint — из отчётов
            for f in app/build/intermediates/lint_intermediate_text_report/*/*/lint-results*.txt wear/build/intermediates/lint_intermediate_text_report/*/*/lint-results*.txt app/build/reports/lint-results*.txt wear/build/reports/lint-results*.txt; do
              [ -f "$f" ] && grep -E "Error:" -A3 "$f" | sed 's/%/%25/g' | head -60 >> errors.txt
            done
            split -l 20 errors.txt err_ || true
            for f in err_*; do
              [ -s "$f" ] && echo "::error title=Gradle::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"
            done
            exit 1
          fi

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p dist
          APK="dist/apex-vpn-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # 11. Приложение для часов Wear OS
          WEAR="dist/apex-watch-${VERSION_NAME}.apk"
          if [ -f wear/build/outputs/apk/release/wear-release.apk ]; then
            cp wear/build/outputs/apk/release/wear-release.apk "$WEAR"
            echo "::notice title=Wear OS::$(du -h "$WEAR" | cut -f1)"
          fi
          # Проверка: APK целый и подписан
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" > signer.txt; head -3 signer.txt
          # Защита от подделок: релиз должен быть подписан ключом автора — тем же, что записан
          # в Integrity.kt. Иначе приложение назвало бы свою же сборку «неофициальной копией».
          GOT=$(grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' signer.txt | head -1 | tr 'a-f' 'A-F')
          WANT=$(grep -oP 'OFFICIAL_CERT = "\K[0-9A-F]+' app/src/main/java/com/apexvpn/client/data/Integrity.kt)
          if [ "$GOT" != "$WANT" ]; then
            if [ "${{ github.repository }}" = "Dubstep2004/apex-vpn" ]; then
              echo "::error title=Подпись::APK подписан не официальным ключом ($GOT). Проверьте секреты APEX_KEYSTORE_BASE64 и APEX_KEYSTORE_PASSWORD — релиз не выпущен."
              exit 1
            fi
            echo "::warning title=Подпись::Сборка подписана не ключом автора — приложение покажет «Неофициальная копия»."
          else
            echo "::notice title=Подпись::✓ Официальный ключ"
          fi
          LIBS=$(unzip -l "$APK" | grep -oE "lib/[^ ]+\.so" | tr '\n' ' ')
          echo "::notice title=APK::$(du -h "$APK" | cut -f1) — $LIBS"
          echo "$LIBS" | grep -q "arm64-v8a/libxray.so" || { echo "::error title=APK::в APK нет ядра Xray"; exit 1; }
          # Что нового — из data/Changelog.kt (первая запись) с метками: 🟢 Новое, 🟣 Улучшено/Изменено, 🔵 Исправлено, 🔴 Удалено
          python3 scripts/changelog.py notes "$VERSION_NAME" > dist/changelog.txt
          cat dist/changelog.txt
          # Описание версии для команды «apex publish» на сервере
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" --rawfile notes dist/changelog.txt \
            '{versionCode:$code, versionName:$name, changelog:$notes}' > "dist/apex-vpn-${VERSION_NAME}.json"
          {
            echo "name=$VERSION_NAME"
            echo "code=$VERSION_CODE"
            echo "apk=$APK"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apex-vpn-${{ steps.apk.outputs.name }}
          path: dist/*.apk

      # Прямая ссылка на .apk (не zip) — на странице Releases
      - name: GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.name }}
          name: APEX VPN ${{ steps.apk.outputs.name }}
          body_path: dist/changelog.txt
          files: |
            ${{ steps.apk.outputs.apk }}
            dist/apex-vpn-${{ steps.apk.outputs.name }}.json
            dist/apex-watch-${{ steps.apk.outputs.name }}.apk
          make_latest: true
