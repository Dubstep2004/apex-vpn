name: Build APEX VPN

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # URL файла update.json на вашем сервере (Settings → Secrets and variables → Actions → Variables)
      UPDATE_URL: ${{ vars.UPDATE_URL }}
      # Где будет лежать APK (база для apkUrl в update.json), например https://example.com/apexvpn
      APK_BASE_URL: ${{ vars.APK_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: false

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.13004108" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Cache core
        id: core-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: core-${{ hashFiles('core/**') }}

      - name: Build core (sing-box + apexcore)
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: ./core/build-core.sh

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apex.jks"
            echo "APEX_KEYSTORE_PATH=$RUNNER_TEMP/apex.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет APEX_KEYSTORE_BASE64 не задан — APK будет подписан отладочным ключом, обновления между сборками работать не будут."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log; then
            # Ошибки сборки — в аннотации, чтобы их было видно без полного лога
            grep -E "^e: |error:|What went wrong|Could not|> " gradle.log | sed 's/%/%25/g' | head -200 > errors.txt || true
            split -l 20 errors.txt err_ || true
            for f in err_*; do
              [ -s "$f" ] && echo "::error title=Gradle::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"
            done
            exit 1
          fi

      - name: Collect APK and update.json
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p dist
          APK="dist/apex-vpn-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          BASE="${APK_BASE_URL:-https://example.com/apexvpn}"
          cat > dist/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${BASE%/}/apex-vpn-${VERSION_NAME}.apk",
            "sha256": "${SHA}",
            "changelog": "Версия ${VERSION_NAME}",
            "mandatory": false,
            "minSupportedVersionCode": 1
          }
          EOF
          cat dist/update.json

      - uses: actions/upload-artifact@v4
        with:
          name: apex-vpn
          path: dist/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
