name: Download stats

# 211. Раз в день и после выпуска версии обновляет docs/stats.svg — картинку со скачиваниями в README
on:
  schedule:
    - cron: "41 2 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stats image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate | python3 scripts/download-stats.py > docs/stats.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stats.svg
          git diff --cached --quiet || { git commit -m "Статистика скачиваний"; git push; }
